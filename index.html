<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #ececec;
    --line-strong: #cdcdcd;
    --accent: #e0592a;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px -12px rgb(0 0 0 / .16);
    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 0 max(16px, 4vw);
    background: var(--bg); color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .bar { width: 100%; max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }

  header.bar { padding: 28px 0; animation: fade .8s var(--ease) .1s both; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.02em; }
  .brand svg { height: 38px; width: auto; display: block; fill: var(--ink); overflow: visible; }
  .brand .arrow { animation: launch 1.1s var(--ease) .35s both; }

  main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 0 56px; }

  /* Route: the one piece of motion */
  .route { position: relative; width: min(600px, 100%); margin-bottom: clamp(44px, 7vh, 64px); animation: fade 1s var(--ease) .25s both; }
  .route svg { display: block; width: 100%; height: auto; overflow: visible; }
  .guide { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1.5 7; }
  .progress { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; transition: opacity .6s ease; }
  .dot-a { fill: var(--ink); }
  .dot-b { fill: var(--accent); }
  .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .plane { fill: var(--ink); transition: opacity .5s ease; }
  .labels { position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; height: 1em; font-size: .68rem; font-weight: 600; letter-spacing: .18em; color: var(--muted); }
  .labels span { position: absolute; }
  .labels span:first-child { left: 6.67%; transform: translateX(-50%); }
  .labels span:last-child { right: 6.67%; transform: translateX(50%); }

  h1 {
    max-width: 15em;
    font-family: var(--display); font-weight: 600; font-variation-settings: "opsz" 96;
    font-size: clamp(2.25rem, 5.4vw, 4.4rem); line-height: 1.05; letter-spacing: -.035em;
    text-wrap: balance;
  }
  h1 span { display: block; animation: rise .9s var(--ease) both; }
  h1 span:first-child { animation-delay: .4s; }
  h1 span:last-child { color: var(--muted); animation-delay: .52s; }

  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: clamp(24px, 4.5vh, 40px); padding: 10px 18px 10px 15px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    font-size: .95rem; font-weight: 500;
    animation: rise .9s var(--ease) .7s both;
  }
  .pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--accent); animation: ping 2.4s ease-out 1.6s infinite; }
  .pill svg { width: 16px; height: 16px; fill: var(--accent); }

  footer.bar { padding: 24px 0 max(28px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); animation: fade .8s var(--ease) .9s both; }

  @media (max-width: 560px) {
    .guide, .progress { stroke-width: 2.4; }
    footer.bar { flex-direction: column; gap: 4px; text-align: center; }
  }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }
  @keyframes launch { from { opacity: 0; transform: translate(-150px, 115px); } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(2.8); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>

<script>
(() => {
  const route = document.getElementById("route");
  const progress = document.getElementById("progress");
  const plane = document.getElementById("plane");
  const ring = document.getElementById("ring");
  const L = route.getTotalLength();
  progress.style.strokeDasharray = `${L} ${L}`;

  function place(l) {
    const p = route.getPointAtLength(l);
    const a = route.getPointAtLength(Math.max(0, l - 1));
    const b = route.getPointAtLength(Math.min(L, l + 1));
    const angle = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
    plane.setAttribute("transform", `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${angle.toFixed(2)})`);
    progress.style.strokeDashoffset = (L - l).toFixed(2);
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { place(L * 0.5); return; }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const fly = (ms) => new Promise((done) => {
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      place(ease(t) * L);
      t < 1 ? requestAnimationFrame(tick) : done();
    };
    requestAnimationFrame(tick);
  });

  place(0);
  (async () => {
    await wait(1300);
    for (;;) {
      await fly(4200);
      ring.animate(
        [{ transform: "scale(1)", opacity: 0.8 }, { transform: "scale(4)", opacity: 0 }],
        { duration: 1100, easing: "cubic-bezier(.16,1,.3,1)" }
      );
      plane.style.opacity = 0;
      await wait(1100);
      progress.style.opacity = 0;
      await wait(700);
      place(0);
      progress.style.opacity = 1;
      plane.style.opacity = 1;
      await wait(900);
    }
  })();
})();
</script>
